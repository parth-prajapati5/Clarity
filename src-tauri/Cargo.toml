[package]
name    = "clarity-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

# Tauri requires lib + bin
[lib]
name = "clarity_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clarity-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# ── Tauri ────────────────────────────────────────────────────
tauri        = { version = "2.0", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = { version = "2.0" }

# ── Serialization ────────────────────────────────────────────
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

# ── Database ─────────────────────────────────────────────────
rusqlite     = { version = "0.32", features = ["bundled"] }
# `bundled` compiles SQLite from source — no external dll needed

# ── Date/time ────────────────────────────────────────────────
chrono       = { version = "0.4", features = ["serde"] }

# ── Logging ──────────────────────────────────────────────────
log          = "0.4"
env_logger   = "0.11"

# ── Error handling ───────────────────────────────────────────
thiserror    = "2"
anyhow       = "1.0"

# ── Concurrency ──────────────────────────────────────────────
parking_lot  = "0.12"
png          = "0.17"

[target.'cfg(windows)'.dependencies]
# Windows APIs for foreground-window detection
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",   # CreateToolhelp32Snapshot for process enumeration
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
] }
# Direct Windows UI Automation for reading browser address bars
uiautomation = "0.25"

[profile.dev]
incremental = true
debug = 1
codegen-units = 1

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
